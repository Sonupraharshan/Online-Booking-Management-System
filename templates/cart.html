<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart - BookHaven</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', sans-serif;
        background: #0f0f1a;
        min-height: 100vh;
        color: #fff;
      }
      
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(15, 15, 26, 0.95);
        backdrop-filter: blur(20px);
        padding: 15px 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .nav-brand {
        font-size: 1.6em;
        font-weight: 700;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .nav-links a, .nav-links button {
        color: rgba(255,255,255,0.8);
        text-decoration: none;
        font-weight: 500;
        padding: 10px 18px;
        border-radius: 10px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.95em;
        transition: all 0.3s;
      }
      .nav-links a:hover, .nav-links button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      #logoutBtn {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        color: white;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      h1 {
        text-align: center;
        font-size: 2.2em;
        margin-bottom: 40px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .cart-items {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .cart-item {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 25px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        display: grid;
        grid-template-columns: 1fr 120px 150px 100px;
        gap: 20px;
        align-items: center;
        transition: all 0.3s;
      }
      .cart-item:hover {
        border-color: rgba(99, 102, 241, 0.3);
      }

      .item-info h3 {
        font-size: 1.1em;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .item-info p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.95em;
      }

      .item-price {
        font-size: 1.3em;
        font-weight: 700;
        color: #6366f1;
        text-align: center;
      }

      .quantity-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .quantity-controls button {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: white;
        font-size: 1.2em;
        cursor: pointer;
        transition: all 0.2s;
      }
      .quantity-controls button:hover {
        background: rgba(99, 102, 241, 0.3);
        border-color: #6366f1;
      }
      .quantity-controls span {
        font-size: 1.1em;
        font-weight: 600;
        min-width: 30px;
        text-align: center;
      }

      .remove-btn {
        background: rgba(239, 68, 68, 0.1);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
      }
      .remove-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        border-color: #ef4444;
      }

      .cart-summary {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 30px;
        margin-top: 30px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
        font-size: 1.1em;
      }
      .summary-row.total {
        font-size: 1.4em;
        font-weight: 700;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin-top: 15px;
      }
      .summary-row.total .price {
        color: #22c55e;
      }

      .checkout-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 1.2em;
        font-weight: 600;
        cursor: pointer;
        margin-top: 20px;
        transition: all 0.3s;
      }
      .checkout-btn:hover {
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        transform: translateY(-2px);
      }

      .empty-cart {
        text-align: center;
        padding: 80px 20px;
      }
      .empty-cart .emoji {
        font-size: 5em;
        margin-bottom: 20px;
      }
      .empty-cart h2 {
        font-size: 1.5em;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 15px;
      }
      .empty-cart p {
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 30px;
      }
      .empty-cart a {
        display: inline-block;
        padding: 14px 30px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.3s;
      }
      .empty-cart a:hover {
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
      }

      .login-prompt {
        text-align: center;
        padding: 80px 20px;
        color: rgba(255, 255, 255, 0.6);
      }
      .login-prompt a {
        color: #6366f1;
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .cart-item {
          grid-template-columns: 1fr;
          text-align: center;
        }
        nav {
          padding: 15px 20px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/" class="nav-brand">📚 BookHaven</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/cart/page">🛒 Cart</a>
        <a href="/admin" id="adminLink" style="display: none;">⚙️ Admin</a>
        <span id="userStatus" style="color: rgba(255,255,255,0.6);"></span>
        <button id="logoutBtn" style="display: none;">Logout</button>
      </div>
    </nav>

    <div class="container">
      <h1>🛒 Your Shopping Cart</h1>

      <div id="loginPrompt" class="login-prompt" style="display: none;">
        <p>Please <a href="/login">login</a> to view your cart.</p>
      </div>

      <div id="emptyCart" class="empty-cart" style="display: none;">
        <div class="emoji">🛒</div>
        <h2>Your cart is empty</h2>
        <p>Looks like you haven't added any books yet!</p>
        <a href="/">Browse Books</a>
      </div>

      <div id="cartContent" style="display: none;">
        <div id="cartItems" class="cart-items"></div>

        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span style="color: #22c55e;">FREE</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span class="price" id="totalPrice">$0.00</span>
          </div>
          <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("token");
      const username = localStorage.getItem("username");
      const role = localStorage.getItem("role");
      
      const loginPrompt = document.getElementById("loginPrompt");
      const emptyCart = document.getElementById("emptyCart");
      const cartContent = document.getElementById("cartContent");
      const cartItems = document.getElementById("cartItems");
      const subtotalEl = document.getElementById("subtotal");
      const totalPriceEl = document.getElementById("totalPrice");
      const logoutBtn = document.getElementById("logoutBtn");
      const userStatus = document.getElementById("userStatus");
      const adminLink = document.getElementById("adminLink");

      // --- Auth UI ---
      if (token && username) {
        userStatus.innerText = `Hi, ${username}`;
        logoutBtn.style.display = "inline";
        if (role === 'admin') {
          adminLink.style.display = "inline";
        }
      }

      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        localStorage.removeItem("role");
        window.location.href = "/";
      });

      // --- Load Cart ---
      async function loadCart() {
        if (!token) {
          loginPrompt.style.display = "block";
          emptyCart.style.display = "none";
          cartContent.style.display = "none";
          return;
        }

        try {
          const res = await fetch("/cart/", {
            headers: { Authorization: "Bearer " + token },
          });

          if (res.status === 401) {
            loginPrompt.style.display = "block";
            return;
          }

          const data = await res.json();

          if (data.length === 0) {
            emptyCart.style.display = "block";
            cartContent.style.display = "none";
            return;
          }

          emptyCart.style.display = "none";
          cartContent.style.display = "block";
          cartItems.innerHTML = "";

          let total = 0;

          data.forEach((item) => {
            total += item.price * item.quantity;
            const itemEl = document.createElement("div");
            itemEl.className = "cart-item";
            itemEl.innerHTML = `
              <div class="item-info">
                <h3>${item.title}</h3>
                <p>by ${item.author}</p>
              </div>
              <div class="item-price">$${item.price.toFixed(2)}</div>
              <div class="quantity-controls">
                <button onclick="updateQuantity(${item.cart_id}, ${item.quantity - 1})">−</button>
                <span>${item.quantity}</span>
                <button onclick="updateQuantity(${item.cart_id}, ${item.quantity + 1})">+</button>
              </div>
              <button class="remove-btn" onclick="removeItem(${item.cart_id})">Remove</button>
            `;
            cartItems.appendChild(itemEl);
          });

          subtotalEl.textContent = `$${total.toFixed(2)}`;
          totalPriceEl.textContent = `$${total.toFixed(2)}`;
        } catch (err) {
          console.error("Error loading cart:", err);
        }
      }

      async function updateQuantity(cart_id, quantity) {
        if (quantity <= 0) {
          await removeItem(cart_id);
          return;
        }

        await fetch("/cart/update", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({ cart_id, quantity }),
        });

        loadCart();
      }

      async function removeItem(cart_id) {
        await fetch("/cart/remove", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({ cart_id }),
        });

        loadCart();
      }

      function checkout() {
        alert("Checkout functionality coming soon!");
      }

      loadCart();
    </script>
  </body>
</html>
